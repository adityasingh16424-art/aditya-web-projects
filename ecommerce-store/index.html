<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aditya Store — E-Commerce</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f5f6f8;
      color: #1f2937;
    }
    header {
      background: #111827;
      color: #fff;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
    }
    nav a {
      color: #e5e7eb;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }
    .hero {
      padding: 48px 32px;
      text-align: center;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }
    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .hero p {
      color: #6b7280;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .products {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .card h3 {
      margin-bottom: 8px;
    }
    .price {
      font-weight: bold;
      color: #111827;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Aditya Store</div>
    <nav>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>नए कलेक्शन के साथ अपना स्टोर शुरू करें</h1>
    <p>बेहतरीन क्वालिटी के प्रोडक्ट्स सीधे आपके स्टोर पर।</p>
    <a href="#products" class="btn">Products देखें</a>
  </section>

  <section id="products" class="products">
    <div class="card">
      <h3>Classic T-Shirt</h3>
      <div class="price">₹599</div>
      <button class="btn" onclick="addToCart('Classic T-Shirt')">Add to Cart</button>
    </div>
    <div class="card">
      <h3>Wireless Earbuds</h3>
      <div class="price">₹1,299</div>
      <button class="btn" onclick="addToCart('Wireless Earbuds')">Add to Cart</button>
    </div>
    <div class="card">
      <h3>Smart Watch</h3>
      <div class="price">₹1,999</div>
      <button class="btn" onclick="addToCart('Smart Watch')">Add to Cart</button>
    </div>
  </section>

  <script>
    function addToCart(itemName) {
      alert(itemName + " cart mein add ho gaya!");
    }
  </script>
</body>
</html>
